<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — ZENITH</title>
<meta name="description" content="Browse the full ZENITH catalog — audio, wearables, tech, footwear, accessories and home.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ff4d24'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<div class="scroll-progress"><span id="progress"></span></div>
<div id="header-root"></div>

<main class="container">
  <section class="page-hero" style="padding-bottom:24px">
    <nav class="crumbs"><a href="index.html">Home</a><i>/</i><span>Shop</span></nav>
    <h1>The <em style="font-style:normal;color:var(--acc)">whole</em> catalog.</h1>
  </section>

  <div class="shop-tools" style="margin-bottom:34px">
    <div class="chips" id="cat-chips"></div>
    <input type="text" class="shop-search" id="shop-q" placeholder="Search…">
    <select id="shop-sort" aria-label="Sort products">
      <option value="featured">Featured</option>
      <option value="price-asc">Price: Low → High</option>
      <option value="price-desc">Price: High → Low</option>
      <option value="rating">Top rated</option>
    </select>
  </div>

  <p class="results-meta" id="results-meta"></p>

  <section class="grid-shop">
    <div class="grid-products" id="shop-grid"></div>
  </section>
</main>

<div id="footer-root"></div>
<div id="drawer-root"></div>
<div id="search-root"></div>
<div id="toast-root"></div>
<div id="cursor-root"></div>

<script src="https://cdn.jsdelivr.net/npm/motion@10.18.0/motion.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
